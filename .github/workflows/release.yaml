name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - v*

concurrency:
  group: release
  cancel-in-progress: false

permissions: read-all

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    # Releases need permissions to read and write the repository contents.
    # GitHub considers creating releases and uploading assets as writing contents.
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0

      - name: Set-up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.46.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: goreleaser
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: v2.17.0
          args: release --clean

      - name: Verify keyless checksum signature
        env:
          CHECKSUM_PATH: ./dist/${{ github.event.repository.name }}_${{ fromJSON(steps.goreleaser.outputs.metadata).version }}_SHA256SUMS
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle "${CHECKSUM_PATH}.sigstore.json" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${CHECKSUM_PATH}"

      - name: Attest artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: ./dist/${{ github.event.repository.name }}_${{ fromJSON(steps.goreleaser.outputs.metadata).version }}_SHA256SUMS

      - name: Publish OpenTofu OCI mirror
        id: oci
        env:
          GHCR_TOKEN: ${{ github.token }}
          OCI_REPOSITORY: ghcr.io/pretty-good-software-org/opentofu-providers/pretty-good-software-org/github
          VERSION: ${{ fromJSON(steps.goreleaser.outputs.metadata).version }}
        run: |
          set -euo pipefail

          oci_layout="$(mktemp -d)"
          trap 'rm -rf "${oci_layout}"' EXIT

          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          ./scripts/build-opentofu-provider-oci.sh "${VERSION}" ./dist "${oci_layout}"
          oras cp --from-oci-layout "${oci_layout}:${VERSION}" "${OCI_REPOSITORY}:${VERSION}"

          oci_digest="$(oras resolve "${OCI_REPOSITORY}:${VERSION}")"
          echo "reference=${OCI_REPOSITORY}@${oci_digest}" >> "$GITHUB_OUTPUT"

      - name: Sign and verify OpenTofu OCI mirror
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          OCI_REFERENCE: ${{ steps.oci.outputs.reference }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail

          cosign sign --yes "${OCI_REFERENCE}"
          cosign verify \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${OCI_REFERENCE}"
