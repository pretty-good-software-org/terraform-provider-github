name: Tooling

on:
  push:
    branches:
      - main
      - release-v*
  pull_request:
    branches:
      - main
      - release-v*

concurrency:
  group: tooling-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    name: Mise tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Mise
        uses: jdx/mise-action@0c6ea298a49e2fc9b6b8ec854c2e6c292490f032 # v4.3.0
        env:
          MISE_ENV: ci
        with:
          version: 2026.7.7
          install: true
      - name: Check Markdown lifecycle
        run: |
          mise run lint:rumdl
          mise run check:markdown-format
      - name: Lint workflow and YAML files
        run: |
          mise run lint:actionlint
          mise run lint:yamllint
      - name: Check provider dependencies
        run: mise run lint:vulncheck
