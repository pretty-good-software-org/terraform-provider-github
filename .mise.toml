# Base tool versions — shared across all environments
# Domain-specific tools should be added by derived templates.
[settings]
experimental = true

[tools]
actionlint = "1.7.11"
yamllint = "1.38.0"
# Native Mise provisioning owns rumdl's pinned executable lifecycle; no separate formatter environment is needed.
rumdl = "0.2.38"
go = "1.26.6"
golangci-lint = "2.11.3"
goreleaser = "2.17.0"
