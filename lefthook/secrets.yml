pre-commit:
  commands:
    gitleaks:
      run: gitleaks protect --staged --verbose
      fail_text: "gitleaks detected secrets in staged changes"

pre-push:
  commands:
    gitleaks:
      run: >-
        bash -c 'base=$(git merge-base origin/main HEAD) &&
        gitleaks detect --log-opts="${base}..HEAD" --verbose'
      fail_text: "gitleaks detected secrets in pushed commits"
