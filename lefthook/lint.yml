pre-commit:
  parallel: true
  commands:
    actionlint:
      glob: ".github/workflows/*.{yaml,yml}"
      run: mise run lint:actionlint
      fail_text: "actionlint found issues"

    yamllint:
      glob: "**/*.{yaml,yml}"
      run: mise run lint:yamllint
      fail_text: "yamllint found issues"

    markdown-format:
      glob: "**/*.md"
      run: mise run check:markdown-format
      fail_text: "mdformat found formatting issues"

    markdownlint:
      glob: "**/*.md"
      run: mise run lint:markdownlint
      fail_text: "markdownlint found issues"
